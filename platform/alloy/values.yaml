controller:
  type: daemonset
  # Also collect logs from tainted control-plane nodes.
  tolerations:
    - operator: Exists

alloy:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  configMap:
    create: true
    content: |
      // Tail only the pods on this node through the Kubernetes API (no hostPath needed).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("NODE_NAME"), "")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // The Loki tenant is the namespace, which keeps tenants isolated at query time.
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "tenant"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.tenant.receiver]
      }

      loki.process "tenant" {
        stage.tenant {
          label = "tenant"
        }
        stage.label_drop {
          values = ["tenant"]
        }
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
