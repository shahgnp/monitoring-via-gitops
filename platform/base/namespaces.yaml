apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    monitoring.poc/platform: "true"
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    monitoring.poc/platform: "true"
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    monitoring.poc/platform: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    monitoring.poc/platform: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
# node-exporter needs host access, so the namespace cannot enforce restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    monitoring.poc/platform: "true"
    pod-security.kubernetes.io/enforce: privileged
