{{- $ns := required "namespace is required" .Values.namespace -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-nginx
  namespace: {{ $ns }}
data:
  default.conf: |
    # Structured access log: the golden-signals dashboard parses status and request_time from it.
    log_format sre escape=json '{"ts":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"request_time":$request_time,"bytes_sent":$body_bytes_sent}';
    server {
      listen 8080;
      access_log /dev/stdout sre;
      location = /stub_status {
        access_log off;
        stub_status;
        allow 127.0.0.1;
        deny all;
      }
      location = /error {
        return 500 "simulated error from {{ .Values.tenant }}\n";
      }
      location = /unavailable {
        return 503 "simulated overload from {{ .Values.tenant }}\n";
      }
      location = /payload {
        default_type text/plain;
        return 200 "{{ repeat 300 "0123456789" }}\n";
      }
      location = /health {
        access_log off;
        return 200 "ok\n";
      }
      location / {
        default_type text/plain;
        return 200 "hello from {{ .Values.tenant }}\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: {{ $ns }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "demo.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ .Values.images.nginx }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
        - name: exporter
          image: {{ .Values.images.exporter }}
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8080/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: conf
          configMap:
            name: demo-app-nginx
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: {{ $ns }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "demo.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app
  namespace: {{ $ns }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "demo.labels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: 30s
---
# Generates requests so metrics and logs show up immediately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-gen
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: traffic-gen
    app.kubernetes.io/instance: {{ .Values.tenant }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-gen
      app.kubernetes.io/instance: {{ .Values.tenant }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-gen
        app.kubernetes.io/instance: {{ .Values.tenant }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: {{ .Values.images.curl }}
          command:
            - /bin/sh
            - -c
            - |
              i=0
              while true; do
                i=$((i+1))
                curl -s -o /dev/null http://demo-app:8080/
                if [ $((i % 4)) -eq 0 ]; then curl -s -o /dev/null http://demo-app:8080/payload; fi
                if [ $((i % {{ .Values.traffic.errorEvery }})) -eq 0 ]; then curl -s -o /dev/null http://demo-app:8080/error; fi
                if [ $((i % {{ .Values.traffic.unavailableEvery }})) -eq 0 ]; then curl -s -o /dev/null http://demo-app:8080/unavailable; fi
                # A throttled client makes the server-side request_time grow (latency/saturation signal).
                if [ $((i % {{ .Values.traffic.slowEvery }})) -eq 0 ]; then curl -s -o /dev/null --limit-rate 1k http://demo-app:8080/payload; fi
                sleep {{ .Values.trafficIntervalSeconds }}
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
