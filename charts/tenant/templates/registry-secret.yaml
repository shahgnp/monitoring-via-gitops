# Read by the Grafana reconciler to create the tenant's org, user and datasources.
apiVersion: v1
kind: Secret
metadata:
  name: tenant-{{ .Values.tenant }}
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    monitoring.poc/tenant: "true"
type: Opaque
stringData:
  tenant: {{ .Values.tenant | quote }}
  namespace: {{ .Values.namespace | quote }}
  members: {{ .Values.members | toJson | quote }}
