# Read by the Grafana reconciler to create the tenant's org, user and datasources.
apiVersion: v1
kind: Secret
metadata:
  name: tenant-{{ .Values.tenant }}
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    monitoring.poc/tenant: "true"
type: Opaque
stringData:
  tenant: {{ .Values.tenant | quote }}
  namespace: {{ .Values.namespace | quote }}
  login: {{ .Values.grafana.login | quote }}
  email: {{ .Values.grafana.email | default (printf "%s@poc.local" .Values.grafana.login) | quote }}
  password: {{ .Values.grafana.password | quote }}
  prometheusUrl: {{ printf "http://%s.%s.svc.cluster.local:8080" (include "tenant.proxyName" .) .Values.monitoringNamespace | quote }}
