{{- range $ns := include "tenant.namespaces" . | fromJsonArray }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tenant-alerts
  namespace: {{ $ns }}
spec:
  groups:
    - name: {{ $.Values.tenant }}.rules
      rules:
        - alert: TenantTargetDown
          expr: up{namespace="{{ $ns }}"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A scrape target in {{ $ns }} is down
---
# The operator adds namespace="<this namespace>" to every route, so alerts stay inside the namespace.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: tenant-routing
  namespace: {{ $ns }}
spec:
  route:
    receiver: "null"
    groupBy: [alertname]
  receivers:
    - name: "null"
{{- end }}
