{{- $_ := include "tenant.validate" . -}}
{{- range $ns := include "tenant.namespaces" . | fromJsonArray }}
{{- if $.Values.manageNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    tenant: {{ $.Values.tenant | quote }}
    pod-security.kubernetes.io/enforce: restricted
---
# CIS 5.1.5: default service accounts must not mount API tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ $ns }}
automountServiceAccountToken: false
{{- end }}
{{- if $.Values.networkPolicy.enabled }}
---
# Only the namespace's own pods and Prometheus (scraping) may reach its pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-ingress
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.monitoringNamespace }}
{{- end }}
{{- end }}
