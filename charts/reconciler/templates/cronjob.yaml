apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-reconciler-script
  namespace: {{ .Values.namespace }}
data:
  reconcile.sh: |-
    {{- .Files.Get "files/reconcile.sh" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-reconciler-dashboards
  namespace: {{ .Values.namespace }}
data:
  golden-signals-logs.json: |-
    {{- .Files.Get "files/golden-signals-logs.json" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-reconciler
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-reconciler
        spec:
          serviceAccountName: grafana-reconciler
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: {{ .Values.image }}
              command: ["bash", "/scripts/reconcile.sh"]
              env:
                - name: HOME
                  value: /tmp
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: GRAFANA_URL
                  value: {{ .Values.grafana.url | quote }}
                - name: LOKI_URL
                  value: {{ .Values.lokiUrl | quote }}
                - name: GF_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.grafana.adminSecret }}
                      key: admin-user
                - name: GF_PASS
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.grafana.adminSecret }}
                      key: admin-password
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: dashboards
                  mountPath: /dashboards
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: grafana-reconciler-script
            - name: dashboards
              configMap:
                name: grafana-reconciler-dashboards
            - name: tmp
              emptyDir: {}
