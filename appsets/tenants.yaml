# One Application per tenants/<name> directory: namespace, isolation, metrics proxy, alerting, Grafana registry entry.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/shahgnp/monitoring-via-gitops.git
        revision: main
        directories:
          - path: tenants/*
  template:
    metadata:
      name: 'onboard-{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/shahgnp/monitoring-via-gitops.git
        targetRevision: main
        path: charts/tenant
        helm:
          valueFiles:
            - '../../{{.path.path}}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
        retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
