# Demo workload per tenant; deployed into the tenant namespace once the tenants ApplicationSet has created it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/shahgnp/monitoring-via-gitops.git
        revision: main
        directories:
          - path: tenants/*
  template:
    metadata:
      name: 'demo-{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/shahgnp/monitoring-via-gitops.git
        targetRevision: main
        path: charts/demo-app
        helm:
          valueFiles:
            - '../../{{.path.path}}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
        retry: { limit: 15, backoff: { duration: 20s, factor: 2, maxDuration: 5m } }
