# Demo tenant. The directory name must equal the namespace.
tenant: tenant-b
namespace: tenant-b
# Grafana members: read-only Viewers of the shared org who only see this tenant's folder.
# Add a login to give someone access; remove it to revoke (the account is deleted). PoC passwords in plaintext.
members:
  - login: tenant-b
    email: tenant-b@poc.local
    password: TenantB-Poc-2026
# Synthetic load: one error / one slow request every N requests (noisier than tenant-a).
traffic:
  errorEvery: 3
  slowEvery: 4
