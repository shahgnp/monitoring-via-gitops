# Demo tenant. The directory name must equal its first namespace (the demo workload deploys there).
tenant: tenant-a
# One tenant can span several namespaces; its dashboards get a namespace filter.
namespaces: [tenant-a, tenant-a-jobs]
manageNamespace: true
networkPolicy:
  enabled: true
# Grafana members: read-only Viewers of the shared org who only see this tenant's folder.
# Add a login to give someone access; remove it to revoke (the account is deleted). PoC passwords in plaintext.
members:
  - login: tenant-a
    email: tenant-a@poc.local
    password: TenantA-Poc-2026
  - login: tenant-a-viewer2
    email: tenant-a-viewer2@poc.local
    password: TenantA-Viewer2-2026
# Synthetic load: one error / one slow request every N requests.
traffic:
  errorEvery: 5
  slowEvery: 6
